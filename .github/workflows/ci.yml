# Company: EonHive Inc.
# Title: URK CI
# Purpose: Build, validate, and report the size of URK packages and proof hosts.
# Author: Stan Nesi
# Created: 2026-10-07
# Updated: 2026-10-07
# Notes: Vibe coded with Codex.

name: URK CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: urk-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Enable the repository package manager
        run: corepack enable
      - name: Install locked dependencies
        run: corepack yarn install --immutable
      - name: Build all packages and production hosts
        run: corepack yarn build
      - name: Report package and browser bundle sizes
        run: corepack yarn report:size
      - name: Add sizes to the run summary
        run: cat .codex/validation/bundle-report/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Check library and website sources
        run: corepack yarn lint
      - name: Check proof host sources
        run: |
          corepack yarn workspace urk-examples lint
          corepack yarn workspace @urk/next-proof lint
      - name: Check lifecycle, contracts, packed packages, and server rendering
        run: corepack yarn test
      - name: Install Chromium and its system dependencies
        run: corepack yarn workspace urk-examples exec playwright install --with-deps chromium
      - name: Check standalone, React, and Next browser hosts
        run: corepack yarn test:integration
      - name: Retain size reports and browser diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: urk-validation-${{ github.run_attempt }}
          path: |
            .codex/validation/bundle-report/
            .codex/validation/ownership-report/
            .codex/validation/ownership-browser/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
