<!--
  Company: EonHive Inc. | Title: Plain uRK Player Iframe
  Purpose: Host a trusted export from a separate origin without a Web Component or host JavaScript.
  Author: Stan Nesi | Created: 2026-10-17 | Updated: 2026-10-17
  Notes: Vibe coded with Codex.
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>uRK experience — plain iframe</title>
    <style>
      body { margin:0; padding:16px; font:16px/1.5 system-ui,sans-serif; background:#f4f7fb; }
      main { max-width:1200px; margin:auto; }
      iframe { display:block; width:100%; height:80vh; border:1px solid #cbd5e1; border-radius:12px; background:white; }
    </style>
  </head>
  <body>
    <main>
      <h1>An exported uRK experience</h1>
      <p>Click inside to interact. The experience is hosted on a separate origin.</p>
      <!-- Keep src on a different origin from this page when using these sandbox permissions. -->
      <iframe title="uRK Picking experience" src="http://127.0.0.1:8091/picking/"
        sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-forms"
        allow="autoplay 'src'; fullscreen 'src'; camera 'none'; microphone 'none'; geolocation 'none'"
        allowfullscreen referrerpolicy="no-referrer"></iframe>
    </main>
  </body>
</html>
